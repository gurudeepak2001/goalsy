name: Enforce Branch Protection

# Run manually to (re-)apply the required-status-check rules for main.
# Requires a repository secret named REPO_ADMIN_TOKEN whose value is a
# classic Personal Access Token with the `repo` scope (which includes
# `administration:write`).  The default GITHUB_TOKEN does not have
# administration write permission, so it cannot set branch protection rules.
#
# How to create the PAT:
#   GitHub → Settings → Developer settings → Personal access tokens → Tokens (classic)
#   → Generate new token → select `repo` scope → copy value
#
# How to add it to this repository:
#   Repository → Settings → Secrets and variables → Actions → New repository secret
#   Name: REPO_ADMIN_TOKEN
#   Value: <paste PAT>

on:
  workflow_dispatch:

jobs:
  set-branch-protection:
    name: Require typecheck, cookie-round-trip, and api-server-test on main
    runs-on: ubuntu-latest
    permissions:
      contents: read   # only code read; admin actions use the PAT below

    steps:
      - name: Apply required-status-check rules
        env:
          GH_TOKEN: ${{ secrets.REPO_ADMIN_TOKEN }}
        run: |
          set -euo pipefail

          REPO="${{ github.repository }}"
          BRANCH="main"

          # All checks that must pass before a PR can be merged into main.
          REQUIRED_CHECKS='["clerk-cookie-round-trip","api-server-test","frontend-typecheck"]'

          echo "Fetching current branch protection for ${BRANCH}…"

          # Read current settings so we can merge rather than overwrite.
          # If no protection exists yet the API returns 404; handle that gracefully.
          CURRENT=$(gh api \
            "repos/${REPO}/branches/${BRANCH}/protection" \
            --jq '{
              required_status_checks: .required_status_checks,
              enforce_admins: (.enforce_admins.enabled // false),
              required_pull_request_reviews: .required_pull_request_reviews,
              restrictions: .restrictions
            }' 2>/dev/null || echo "{}")

          echo "Current protection: ${CURRENT}"

          # Build the updated list of required context strings.
          # Merge existing contexts with the desired list, deduplicating.
          EXISTING_CONTEXTS=$(echo "${CURRENT}" | \
            jq -r '(.required_status_checks.contexts // []) | @json')

          UPDATED_CONTEXTS=$(jq -n \
            --argjson existing "${EXISTING_CONTEXTS}" \
            --argjson required "${REQUIRED_CHECKS}" \
            '($existing + $required) | unique')

          STRICT=$(echo "${CURRENT}" | \
            jq '(.required_status_checks.strict // false)')

          echo "Required contexts after update: ${UPDATED_CONTEXTS}"

          # Preserve other settings; default safe values when absent.
          ENFORCE_ADMINS=$(echo "${CURRENT}" | jq '.enforce_admins // false')

          # required_pull_request_reviews and restrictions must be null or an
          # object — they cannot be omitted from the PUT body.
          PR_REVIEWS=$(echo "${CURRENT}" | jq '.required_pull_request_reviews // null')
          RESTRICTIONS=$(echo "${CURRENT}" | jq '.restrictions // null')

          PAYLOAD=$(jq -n \
            --argjson contexts "${UPDATED_CONTEXTS}" \
            --argjson strict "${STRICT}" \
            --argjson enforce_admins "${ENFORCE_ADMINS}" \
            --argjson pr_reviews "${PR_REVIEWS}" \
            --argjson restrictions "${RESTRICTIONS}" \
            '{
              required_status_checks: {
                strict: $strict,
                contexts: $contexts
              },
              enforce_admins: $enforce_admins,
              required_pull_request_reviews: $pr_reviews,
              restrictions: $restrictions
            }')

          echo "Sending payload: ${PAYLOAD}"

          gh api \
            --method PUT \
            "repos/${REPO}/branches/${BRANCH}/protection" \
            --input - <<< "${PAYLOAD}"

          echo ""
          echo "✅ Branch protection updated."
          echo "   Required status checks enforced on ${BRANCH}:"
          echo "${UPDATED_CONTEXTS}" | jq -r '.[] | "   • " + .'
