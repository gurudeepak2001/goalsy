name: Clerk Locator Canary

# ── Purpose ────────────────────────────────────────────────────────────────────
# Nightly structural pre-flight for the Clerk sign-in WebView.
#
# Runs CookieRotationLocatorCanaryTest, which checks that the element types the
# cookie-rotation test depends on (textField, secureTextField, button) are still
# reachable in Clerk's hosted sign-in component — WITHOUT submitting any
# credentials.
#
# If Clerk silently changes its form markup between rotation runs, this job
# surfaces the drift days before the rotation run fails, giving the team time to
# update locators at a calm moment.
#
# ── No secrets required ────────────────────────────────────────────────────────
# This workflow does not use CLERK_ROTATE_EMAIL or CLERK_ROTATE_PASSWORD.
# It only checks that the expected element types exist in the WebView.
#
# ── On failure ─────────────────────────────────────────────────────────────────
# The job opens a GitHub issue (using GITHUB_TOKEN) titled
# "⚠️ Clerk locator canary failed — update CookieRotationTest locators"
# and labels it `clerk-locator-drift` so it is easy to filter.
# Duplicate issue prevention: the job checks for an open issue with that label
# before opening a new one, so multiple consecutive failures don't flood the
# tracker.

on:
  schedule:
    # Run at 03:00 UTC every day — well before any human is likely to trigger
    # a manual rotation run, so drift is caught with maximum lead time.
    - cron: '0 3 * * *'
  workflow_dispatch:
    # Allow manual runs for testing the canary itself.

jobs:
  locator-canary:
    name: Clerk Sign-In Locator Canary (iPhone 16 Simulator)
    runs-on: macos-14   # Xcode 15, iOS 17 simulator toolchain

    # Only one canary run at a time — a nightly schedule plus a manual trigger
    # could otherwise overlap.
    concurrency:
      group: clerk-locator-canary
      cancel-in-progress: true

    defaults:
      run:
        working-directory: artifacts/goalsy-executive

    permissions:
      # Required to open issues when the canary fails.
      issues: write
      contents: read

    steps:
      # ── 0. Checkout ────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 1. Select Xcode ────────────────────────────────────────────────────
      - name: Select Xcode 15
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      # ── 2. Boot iPhone 16 simulator ────────────────────────────────────────
      - name: Boot iPhone 16 simulator
        run: |
          UDID=$(
            xcrun simctl list devices available -j \
            | python3 -c "
          import sys, json
          devs = json.load(sys.stdin)['devices']
          for runtime, devices in devs.items():
              for d in devices:
                  if 'iPhone 16' in d['name'] and d['isAvailable']:
                      print(d['udid'])
                      exit(0)
          " 2>/dev/null || true
          )
          if [ -z "$UDID" ]; then
            RUNTIME=$(xcrun simctl list runtimes -j | python3 -c "
          import sys, json
          runtimes = json.load(sys.stdin)['runtimes']
          ios = [r for r in runtimes if 'iOS' in r['name'] and r['isAvailable']]
          ios.sort(key=lambda r: r['version'], reverse=True)
          print(ios[0]['identifier'])
          ")
            UDID=$(xcrun simctl create "iPhone 16" \
              com.apple.CoreSimulator.SimDeviceType.iPhone-16 "$RUNTIME")
            echo "Created simulator: $UDID"
          fi
          xcrun simctl boot "$UDID" 2>/dev/null || true
          echo "SIMULATOR_UDID=$UDID" >> "$GITHUB_ENV"
          echo "Booted simulator: $UDID"

      # ── 3. Build app for testing ───────────────────────────────────────────
      - name: Build app for testing
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project ios/App/App.xcodeproj \
            -scheme AppUITests \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -derivedDataPath /tmp/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
          | xcpretty --color \
          || (echo "::error::Build failed — see above for compiler errors"; exit 1)

      # ── 4. Run CookieRotationLocatorCanaryTest ─────────────────────────────
      # Checks element reachability only; no credentials injected.
      - name: Run locator canary (no credentials)
        id: canary
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project ios/App/App.xcodeproj \
            -scheme AppUITests \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -derivedDataPath /tmp/DerivedData \
            -only-testing AppUITests/CookieRotationLocatorCanaryTest/testClerkSignInLocatorsReachable \
            -resultBundlePath /tmp/LocatorCanary.xcresult \
            CODE_SIGNING_ALLOWED=NO \
          | xcpretty --color \
          || (echo "::error::Locator canary failed — Clerk may have changed its sign-in form markup"; exit 1)

      # ── 5. Upload xcresult on failure ──────────────────────────────────────
      - name: Upload test results (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: LocatorCanary-xcresult
          path: /tmp/LocatorCanary.xcresult
          retention-days: 7

      # ── 6. Open a GitHub issue on failure ─────────────────────────────────
      # Prevents duplicate issues: checks for an existing open issue with the
      # `clerk-locator-drift` label before creating a new one.
      - name: Open issue on failure (if no open issue already exists)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO:     ${{ github.repository }}
          RUN_URL:  ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Check for an existing open issue with our label.
          EXISTING=$(gh issue list \
            --repo "$REPO" \
            --label "clerk-locator-drift" \
            --state open \
            --json number \
            --jq 'length')

          if [ "$EXISTING" -gt 0 ]; then
            echo "An open clerk-locator-drift issue already exists — skipping duplicate."
            exit 0
          fi

          # Ensure the label exists (create it if absent).
          gh label create "clerk-locator-drift" \
            --repo "$REPO" \
            --color "e4e669" \
            --description "Clerk sign-in form markup may have drifted" \
            2>/dev/null || true

          gh issue create \
            --repo "$REPO" \
            --title "⚠️ Clerk locator canary failed — update CookieRotationTest locators" \
            --label "clerk-locator-drift" \
            --body "## Clerk Locator Canary Failed

          The nightly \`clerk-locator-canary\` workflow could not find the expected
          element types (textField, secureTextField, or button) in Clerk's hosted
          sign-in WebView.

          **This means the next cookie-rotation run will likely fail** unless the
          locators are updated before it runs.

          ### What to do

          1. **Reproduce locally** by running:
             \`\`\`
             xcodebuild test \\
               -project artifacts/goalsy-executive/ios/App/App.xcodeproj \\
               -scheme AppUITests \\
               -destination 'platform=iOS Simulator,name=iPhone 16' \\
               -only-testing AppUITests/CookieRotationLocatorCanaryTest/testClerkSignInLocatorsReachable \\
               CODE_SIGNING_ALLOWED=NO
             \`\`\`
          2. **Inspect the failure message** — it will name the missing element type and
             suggest which locator to update.
          3. **Update** both \`CookieRotationLocatorCanaryTest.swift\` and the matching
             locator in \`CookieRotationTest.swift\`.
          4. **Push** the fix and confirm this canary passes before triggering the next
             rotation run.

          ### Failed run
          $RUN_URL

          _This issue was opened automatically by the \`clerk-locator-canary\` workflow._"

          echo "Issue created."

      # ── 7. Print success summary ───────────────────────────────────────────
      - name: Print canary summary (on success)
        if: success()
        run: |
          echo ""
          echo "════════════════════════════════════════════════════════════"
          echo "  Clerk Locator Canary — PASSED"
          echo "════════════════════════════════════════════════════════════"
          echo ""
          echo "  ✓ WebView appeared within the expected timeout."
          echo "  ✓ At least one textField is reachable (email input)."
          echo "  ✓ At least one secureTextField is reachable (password input)."
          echo "  ✓ At least one button is reachable (Continue / Sign in)."
          echo ""
          echo "  The cookie-rotation locators look healthy."
          echo "  No action required."
          echo "════════════════════════════════════════════════════════════"
