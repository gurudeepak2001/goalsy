name: Check REPO_ADMIN_TOKEN Expiry

# Runs weekly and warns the team if the PAT used by enforce-branch-protection.yml
# is about to expire (or has already expired).  When a classic PAT lapses the
# workflow that re-applies branch protection fails silently, leaving main
# unprotected without any alert.
#
# How it finds the expiry date
# ────────────────────────────
# Fine-grained PAT
#   The GitHub REST API GET /user/personal-access-tokens returns every
#   fine-grained PAT owned by the authenticated user, including its name and
#   expires_at field.  The workflow authenticates as the REPO_ADMIN_TOKEN owner
#   and looks for the token whose name matches REPO_ADMIN_TOKEN_NAME (see below).
#   If exactly one match is found its expires_at is used directly.
#
# Classic PAT (no API listing)
#   GitHub does not expose classic PAT metadata via REST.  Instead, set the
#   repository variable REPO_ADMIN_TOKEN_EXPIRES_AT to the ISO-8601 expiry date
#   (e.g. 2025-09-01) immediately after rotation.  The workflow reads this
#   variable when the API path returns no result.
#
# Missing expiry information
#   If neither the API nor the variable yields an expiry date the workflow
#   exits with a non-zero status so the failure is visible — a silent no-op
#   would defeat the purpose of the check.  The job summary explains what to
#   configure.
#
# Required secrets
# ────────────────
# REPO_ADMIN_TOKEN   — the PAT being monitored; used to call the tokens API
# GITHUB_TOKEN       — automatic; needs issues: write to open alert issues
#
# Required repository variable (classic PATs only)
# ─────────────────────────────────────────────────
# REPO_ADMIN_TOKEN_EXPIRES_AT — ISO-8601 date, e.g. "2025-09-01".
#                               Update this immediately after every rotation.
#
# Optional repository variable (fine-grained PATs)
# ─────────────────────────────────────────────────
# REPO_ADMIN_TOKEN_NAME — display name of the fine-grained PAT as shown in
#                         GitHub Settings.  Defaults to "goalsy-branch-protection-admin"
#                         (the name recommended in BRANCH_PROTECTION_RUNBOOK.md).
#                         Must match exactly one token; the job fails if zero or
#                         multiple tokens match to avoid acting on the wrong token.

on:
  schedule:
    # Every Monday at 09:00 UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  check-expiry:
    name: Check REPO_ADMIN_TOKEN expiry
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read

    steps:
      - name: Determine expiry date and alert if needed
        env:
          # Authenticate API calls as the PAT owner so /user/personal-access-tokens works
          GH_TOKEN: ${{ secrets.REPO_ADMIN_TOKEN }}
          # Separate token with issues:write for opening alert issues
          ALERT_GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Name of the fine-grained PAT (for API lookup). Default matches runbook.
          TOKEN_NAME: ${{ vars.REPO_ADMIN_TOKEN_NAME || 'goalsy-branch-protection-admin' }}
          # Fallback expiry date for classic PATs (must be set after rotation)
          EXPIRES_AT_VAR: ${{ vars.REPO_ADMIN_TOKEN_EXPIRES_AT }}
        run: |
          set -euo pipefail

          REPO="${{ github.repository }}"
          WARN_DAYS=14
          EXPIRES_AT=""

          # ── 1. Try the fine-grained PAT API ──────────────────────────────────
          # GET /user/personal-access-tokens returns an array of fine-grained
          # tokens owned by the authenticated user.  Classic PATs are not included.
          echo "Querying GitHub fine-grained token list for token named '${TOKEN_NAME}'…"

          MATCHES=$(gh api /user/personal-access-tokens \
            --jq "[.[] | select(.name == \"${TOKEN_NAME}\")]" \
            2>/dev/null || echo "[]")

          MATCH_COUNT=$(echo "$MATCHES" | jq 'length')

          if [ "$MATCH_COUNT" -eq 1 ]; then
            API_EXPIRES=$(echo "$MATCHES" | jq -r '.[0].expires_at // ""')
            if [ -n "$API_EXPIRES" ] && [ "$API_EXPIRES" != "null" ]; then
              echo "Found fine-grained token '${TOKEN_NAME}' via API. Expiry: ${API_EXPIRES}"
              # Normalise to YYYY-MM-DD (API may return a full ISO timestamp)
              EXPIRES_AT=$(echo "$API_EXPIRES" | cut -c1-10)
            else
              echo "Token '${TOKEN_NAME}' has no expiry (no-expiration token). No alert needed."
              exit 0
            fi
          elif [ "$MATCH_COUNT" -gt 1 ]; then
            echo "ERROR: Found ${MATCH_COUNT} fine-grained tokens named '${TOKEN_NAME}'."
            echo "Set the REPO_ADMIN_TOKEN_NAME repository variable to the unique display"
            echo "name of the token used as REPO_ADMIN_TOKEN, then re-run."
            exit 1
          else
            echo "No fine-grained token named '${TOKEN_NAME}' found via API."
            echo "(This is expected for classic PATs — they are not listed by the API.)"
          fi

          # ── 2. Fall back to the repository variable (classic PATs) ───────────
          if [ -z "$EXPIRES_AT" ]; then
            if [ -n "$EXPIRES_AT_VAR" ]; then
              echo "Using REPO_ADMIN_TOKEN_EXPIRES_AT repository variable: ${EXPIRES_AT_VAR}"
              EXPIRES_AT="$EXPIRES_AT_VAR"
            else
              echo ""
              echo "ERROR: Could not determine the expiry date for REPO_ADMIN_TOKEN."
              echo ""
              echo "To fix this, do ONE of the following:"
              echo ""
              echo "  A) Fine-grained PAT — set the REPO_ADMIN_TOKEN_NAME repository variable"
              echo "     to the exact display name of the token shown in GitHub Settings."
              echo ""
              echo "  B) Classic PAT — set the REPO_ADMIN_TOKEN_EXPIRES_AT repository variable"
              echo "     to the token's expiry date (ISO-8601, e.g. 2025-09-01)."
              echo "     Update this variable immediately after every rotation."
              echo ""
              echo "  C) No-expiration token — if the token truly never expires, this check"
              echo "     is not needed. You can disable this workflow or acknowledge that"
              echo "     expiry monitoring is intentionally skipped."
              exit 1
            fi
          fi

          # ── 3. Compute days until expiry ─────────────────────────────────────
          TODAY_SEC=$(date -u +%s)
          EXPIRY_SEC=$(date -u -d "${EXPIRES_AT}T00:00:00Z" +%s 2>/dev/null \
                    || date -u -jf "%Y-%m-%dT%H:%M:%SZ" "${EXPIRES_AT}T00:00:00Z" +%s)
          DIFF_DAYS=$(( (EXPIRY_SEC - TODAY_SEC) / 86400 ))

          echo "Token expiry  : ${EXPIRES_AT}"
          echo "Days remaining: ${DIFF_DAYS}"

          if [ "$DIFF_DAYS" -gt "$WARN_DAYS" ]; then
            echo "✅ Token is valid for ${DIFF_DAYS} more days. No action needed."
            exit 0
          fi

          # ── 4. Build the issue body ───────────────────────────────────────────
          if [ "$DIFF_DAYS" -lt 0 ]; then
            URGENCY="🚨 EXPIRED"
            DAYS_MSG="**The token expired ${DIFF_DAYS#-} day(s) ago.**"
          else
            URGENCY="⚠️ EXPIRING SOON"
            DAYS_MSG="**The token expires in ${DIFF_DAYS} day(s) (${EXPIRES_AT}).**"
          fi

          TITLE="${URGENCY}: REPO_ADMIN_TOKEN expires ${EXPIRES_AT}"

          # Use absolute URLs so links resolve correctly from an issue page
          REPO_URL="https://github.com/${REPO}"
          RUNBOOK_URL="${REPO_URL}/blob/main/.github/BRANCH_PROTECTION_RUNBOOK.md"
          WORKFLOW_URL="${REPO_URL}/blob/main/.github/workflows/enforce-branch-protection.yml"
          EXPIRY_CHECK_URL="${REPO_URL}/blob/main/.github/workflows/check-repo-admin-token-expiry.yml"

          BODY="## ${URGENCY}: REPO_ADMIN_TOKEN needs rotation

${DAYS_MSG}

The \`REPO_ADMIN_TOKEN\` secret is used by the
[enforce-branch-protection.yml](${WORKFLOW_URL}) workflow
to re-apply required-status-check rules on \`main\`.
When this PAT lapses the workflow silently fails, leaving branch protection
unable to be enforced without any visible alert.

### Action required

Follow the rotation steps in the
[Branch Protection Runbook](${RUNBOOK_URL}):

1. **Generate a new classic PAT** with the \`repo\` scope (GitHub → Settings →
   Developer settings → Personal access tokens → Tokens (classic)).
2. **Update the \`REPO_ADMIN_TOKEN\` repository secret** with the new value
   (Repository → Settings → Secrets and variables → Actions).
3. **Update expiry tracking** so this workflow keeps working after rotation:
   - *Classic PAT*: update the \`REPO_ADMIN_TOKEN_EXPIRES_AT\` repository
     variable to the new expiry date (ISO-8601, e.g. \`2025-12-31\`).
   - *Fine-grained PAT*: no variable needed — the API tracks it automatically.
     Ensure \`REPO_ADMIN_TOKEN_NAME\` matches the token's display name.
4. **Re-run the Enforce Branch Protection workflow** to confirm it still works
   with the new token.

### Why this matters

Without a valid \`REPO_ADMIN_TOKEN\`:
- The \`enforce-branch-protection.yml\` workflow will fail.
- Branch protection rules cannot be re-applied after accidental removal.
- PRs that should be blocked (e.g. failing CI) could be merged unprotected.

*This issue was opened automatically by the
[check-repo-admin-token-expiry](${EXPIRY_CHECK_URL}) workflow.
Close it once the token has been rotated.*"

          # ── 5. Check for an existing open alert issue (avoid duplicates) ──────
          echo "Checking for existing open alert issues…"
          EXISTING=$(GH_TOKEN="$ALERT_GH_TOKEN" gh api \
            "repos/${REPO}/issues?state=open&labels=repo-admin-token-expiry" \
            --jq 'length' 2>/dev/null || echo "0")

          if [ "$EXISTING" -gt "0" ]; then
            echo "An open alert issue already exists (${EXISTING} found). Skipping creation."
            exit 0
          fi

          # ── 6. Ensure the label exists ────────────────────────────────────────
          GH_TOKEN="$ALERT_GH_TOKEN" gh api \
            --method POST \
            "repos/${REPO}/labels" \
            --field name="repo-admin-token-expiry" \
            --field color="d93f0b" \
            --field description="REPO_ADMIN_TOKEN expiry alert" \
            2>/dev/null || true  # ignore if label already exists

          # ── 7. Open the alert issue ───────────────────────────────────────────
          echo "Opening alert issue…"
          ISSUE_URL=$(GH_TOKEN="$ALERT_GH_TOKEN" gh issue create \
            --repo "$REPO" \
            --title "$TITLE" \
            --body  "$BODY" \
            --label "repo-admin-token-expiry")

          echo ""
          echo "🔔 Alert issue created: ${ISSUE_URL}"
