name: API Server Tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  api-server-test:
    name: api-server-test
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/goalsy_test

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: goalsy_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d goalsy_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Rebuild @workspace/db declaration files so the api-server can typecheck
      # and import table names cleanly.  The db package uses composite: true and
      # emits only .d.ts files; without this step the dist/ declarations may be
      # stale and the test runner will fail to resolve table imports.
      - name: Build @workspace/db declarations
        run: pnpm --filter @workspace/db exec tsc -p tsconfig.json

      - name: Create test database schema
        run: pnpm --filter @workspace/db run push-force

      - name: Run API server tests
        run: pnpm --filter @workspace/api-server run test

      - name: Create prior-version upgrade database
        run: |
          createdb \
            --host localhost \
            --username postgres \
            goalsy_upgrade_test
          psql \
            --host localhost \
            --username postgres \
            --dbname goalsy_upgrade_test \
            --set ON_ERROR_STOP=on \
            --file lib/db/test-fixtures/prior-schema.sql
        env:
          PGPASSWORD: postgres

      - name: Upgrade prior-version database schema
        run: pnpm --filter @workspace/db run push-force
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/goalsy_upgrade_test

      - name: Verify saved data survived schema upgrade
        run: |
          psql \
            --host localhost \
            --username postgres \
            --dbname goalsy_upgrade_test \
            --file lib/db/test-fixtures/verify-upgrade.sql
        env:
          PGPASSWORD: postgres
