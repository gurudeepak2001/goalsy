name: API Server Tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  api-server-test:
    name: api-server-test
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/goalsy_test

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: goalsy_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d goalsy_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Rebuild @workspace/db declaration files so the api-server can typecheck
      # and import table names cleanly.  The db package uses composite: true and
      # emits only .d.ts files; without this step the dist/ declarations may be
      # stale and the test runner will fail to resolve table imports.
      - name: Build @workspace/db declarations
        run: pnpm --filter @workspace/db exec tsc -p tsconfig.json

      - name: Create test database schema
        run: pnpm --filter @workspace/db run push-force

      - name: Run API server tests
        run: pnpm --filter @workspace/api-server run test

      - name: Upgrade supported historical schemas and verify saved data
        run: |
          set -euo pipefail
          shopt -s nullglob

          fixtures=(lib/db/test-fixtures/prior-schema*.sql)
          if (( ${#fixtures[@]} < 2 )); then
            echo "Expected at least two supported historical schema fixtures" >&2
            exit 1
          fi

          for fixture in "${fixtures[@]}"; do
            baseline="$(basename "${fixture}" .sql)"
            database="goalsy_upgrade_${baseline//-/_}"
            expect_briefing_view=false
            if [[ "${baseline}" == "prior-schema-briefing-views" ]]; then
              expect_briefing_view=true
            fi
            echo "::group::Upgrade ${baseline}"

            createdb \
              --host localhost \
              --username postgres \
              "${database}"
            psql \
              --host localhost \
              --username postgres \
              --dbname "${database}" \
              --set ON_ERROR_STOP=on \
              --file "${fixture}"
            DATABASE_URL="postgresql://postgres:postgres@localhost:5432/${database}" \
              pnpm --filter @workspace/db run push-force
            psql \
              --host localhost \
              --username postgres \
              --dbname "${database}" \
              --set ON_ERROR_STOP=on \
              --set "expect_briefing_view=${expect_briefing_view}" \
              --file lib/db/test-fixtures/verify-upgrade.sql

            echo "::endgroup::"
          done
        env:
          PGPASSWORD: postgres
