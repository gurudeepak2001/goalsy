name: Frontend Typecheck

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  frontend-typecheck:
    name: frontend-typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build api-client-react declarations so the project reference resolves.
      # The lib uses composite: true + emitDeclarationOnly; without this step
      # tsc errors with TS6305 on every file that imports from it.
      - name: Build @workspace/api-client-react declarations
        run: pnpm --filter @workspace/api-client-react exec tsc -p tsconfig.json

      - name: Run frontend typecheck
        run: pnpm --filter @workspace/goalsy-executive run typecheck
