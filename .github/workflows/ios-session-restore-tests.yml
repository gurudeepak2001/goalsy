name: iOS Session-Restore Tests

on:
  pull_request:
    branches:
      - main
    paths:
      - 'artifacts/goalsy-executive/ios/**'
      - '.github/workflows/ios-session-restore-tests.yml'
  push:
    branches:
      - main
    paths:
      - 'artifacts/goalsy-executive/ios/**'
      - '.github/workflows/ios-session-restore-tests.yml'

jobs:
  clerk-cookie-round-trip:
    name: Clerk Cookie Round-Trip (AppTests)
    runs-on: macos-14          # Xcode 15, iOS 17 simulator toolchain

    defaults:
      run:
        working-directory: artifacts/goalsy-executive

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 15
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Install xcpretty
        run: gem install xcpretty --no-document

      - name: Show available simulators
        run: xcrun simctl list devices available | grep -E "iPhone 1[5-9]|iPhone 16" || true

      - name: Boot iPhone 16 simulator
        # Create the simulator if it isn't already registered (fresh macOS runner).
        run: |
          UDID=$(
            xcrun simctl list devices available -j \
            | python3 -c "
          import sys, json
          devs = json.load(sys.stdin)['devices']
          for runtime, devices in devs.items():
              for d in devices:
                  if 'iPhone 16' in d['name'] and d['isAvailable']:
                      print(d['udid'])
                      exit(0)
          " 2>/dev/null || true
          )
          if [ -z \"$UDID\" ]; then
            RUNTIME=$(xcrun simctl list runtimes -j | python3 -c "
          import sys, json
          runtimes = json.load(sys.stdin)['runtimes']
          ios = [r for r in runtimes if 'iOS' in r['name'] and r['isAvailable']]
          ios.sort(key=lambda r: r['version'], reverse=True)
          print(ios[0]['identifier'])
          ")
            UDID=$(xcrun simctl create "iPhone 16" com.apple.CoreSimulator.SimDeviceType.iPhone-16 "$RUNTIME")
            echo "Created simulator: $UDID"
          fi
          xcrun simctl boot "$UDID" 2>/dev/null || true
          echo "SIMULATOR_UDID=$UDID" >> "$GITHUB_ENV"

      - name: Run AppTests
        run: |
          set -o pipefail
          xcodebuild test \
            -project ios/App/App.xcodeproj \
            -scheme AppTests \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -resultBundlePath /tmp/AppTests.xcresult \
            CODE_SIGNING_ALLOWED=NO \
          | xcpretty --color --report junit --output /tmp/junit.xml \
          || (xcpretty_exit=$?; \
              echo "::error::AppTests failed — see the xcresult bundle for details"; \
              exit $xcpretty_exit)

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AppTests-results
          path: |
            /tmp/AppTests.xcresult
            /tmp/junit.xml
          retention-days: 14

      - name: Publish test summary
        if: always()
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: /tmp/junit.xml
          check_name: "AppTests — Clerk Cookie Round-Trip"
          fail_on_failure: true

  clerk-session-restore-smoke:
    name: Clerk Session-Restore Smoke Test (AppUITests)
    runs-on: macos-14          # Xcode 15, iOS 17 simulator toolchain
    # Run after the round-trip unit tests; both jobs are independent of each
    # other at the GitHub level, but sequencing keeps the smoke test from
    # consuming a runner slot when the cheaper unit tests have already failed.
    needs: clerk-cookie-round-trip

    defaults:
      run:
        working-directory: artifacts/goalsy-executive

    env:
      CLERK_TEST_COOKIES: ${{ secrets.CLERK_TEST_COOKIES }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 15
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Install xcpretty
        run: gem install xcpretty --no-document

      # ── Preflight: fail fast if the secret is missing or expired ─────────────
      # The smoke test uses XCTSkip when CLERK_TEST_COOKIES is absent, which
      # keeps developer builds green but silently swallows a missing/expired
      # CI secret.  This step exits non-zero before xcodebuild is even invoked,
      # turning a silent skip into a visible pipeline failure.
      - name: Validate CLERK_TEST_COOKIES
        run: bash ios/scripts/validate-clerk-test-cookies.sh

      - name: Boot iPhone 16 simulator
        run: |
          UDID=$(
            xcrun simctl list devices available -j \
            | python3 -c "
          import sys, json
          devs = json.load(sys.stdin)['devices']
          for runtime, devices in devs.items():
              for d in devices:
                  if 'iPhone 16' in d['name'] and d['isAvailable']:
                      print(d['udid'])
                      exit(0)
          " 2>/dev/null || true
          )
          if [ -z "$UDID" ]; then
            RUNTIME=$(xcrun simctl list runtimes -j | python3 -c "
          import sys, json
          runtimes = json.load(sys.stdin)['runtimes']
          ios = [r for r in runtimes if 'iOS' in r['name'] and r['isAvailable']]
          ios.sort(key=lambda r: r['version'], reverse=True)
          print(ios[0]['identifier'])
          ")
            UDID=$(xcrun simctl create "iPhone 16" com.apple.CoreSimulator.SimDeviceType.iPhone-16 "$RUNTIME")
            echo "Created simulator: $UDID"
          fi
          xcrun simctl boot "$UDID" 2>/dev/null || true
          echo "SIMULATOR_UDID=$UDID" >> "$GITHUB_ENV"

      - name: Run AppUITests smoke test
        # CLERK_TEST_COOKIES is forwarded to the test runner via the scheme's
        # TestAction EnvironmentVariables section ($(CLERK_TEST_COOKIES)
        # expansion) — no -testenv flag needed.
        run: |
          set -o pipefail
          xcodebuild test \
            -project ios/App/App.xcodeproj \
            -scheme AppUITests \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -resultBundlePath /tmp/AppUITests.xcresult \
            CODE_SIGNING_ALLOWED=NO \
          | xcpretty --color --report junit --output /tmp/smoke-junit.xml \
          || (xcpretty_exit=$?; \
              echo "::error::AppUITests smoke test failed — session restore may be broken or CLERK_TEST_COOKIES is expired"; \
              echo "::error::Rotate the secret by running: bash artifacts/goalsy-executive/ios/scripts/extract-clerk-test-cookies.sh"; \
              exit $xcpretty_exit)

      - name: Upload smoke test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AppUITests-smoke-results
          path: |
            /tmp/AppUITests.xcresult
            /tmp/smoke-junit.xml
          retention-days: 14

      - name: Publish smoke test summary
        if: always()
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: /tmp/smoke-junit.xml
          check_name: "AppUITests — Session-Restore Smoke"
          fail_on_failure: true
